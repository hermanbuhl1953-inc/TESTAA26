name: Monitoraggio fonti e GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "app.js"
      - "assets/catalog/**"
      - "backend/**"
      - "index.html"
      - "scripts/**"
      - "service-worker.js"
      - "styles.css"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Esegue i test
        run: node --test backend/source-monitor.test.mjs

      - name: Aggiorna il monitoraggio fonti
        run: node backend/refresh-sources.mjs

      - name: Registra lo stato delle fonti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalog/source-monitoring.json
          git add -f backend/data/source-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna controllo delle fonti [skip ci]"
            git push
          fi

      - name: Prepara il sito statico
        run: node scripts/build-pages.mjs

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pubblica su GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
